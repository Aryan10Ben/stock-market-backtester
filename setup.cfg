[metadata]
name = stock-backtester
version = 0.1.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pandas>=2.1.0
    numpy>=1.26.0
    yfinance>=0.2.36
    pydantic>=2.5.0
    pydantic-settings>=2.1.0
    matplotlib>=3.8.0
    PyYAML>=6.0.1
    python-dotenv>=1.0.0
    pyarrow>=14.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    backtester = backtester.cli:main

[tool:pytest]
testpaths = tests
pythonpath = src
addopts = -v --tb=short

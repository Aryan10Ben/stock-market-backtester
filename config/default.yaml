# Default backtest configuration.
# Override via CLI flags, a custom YAML file, or BACKTESTER_* env vars.

ticker: AAPL
start_date: "2020-01-01"
end_date: "2024-12-31"

initial_cash: 100000.0
commission_rate: 0.001      # 0.1% per trade
slippage_bps: 5.0             # 5 basis points

strategy:
  name: ma_crossover
  fast_window: 20
  slow_window: 50
  signal_on: close            # price column used for MA calculation

execution:
  price: open                 # execute on next bar's open (avoids look-ahead bias)
  position_sizing: full       # use all available cash on buy

data:
  cache_enabled: true
  cache_dir: data/cache
  min_bars_buffer: 10         # extra bars required beyond slow_window

output:
  dir: outputs
  chart_dpi: 300

logging:
  level: INFO
  log_dir: logs
  log_file: backtester.log

metrics:
  risk_free_rate: 0.05          # 5% annual — used for Sharpe ratio
  trading_days_per_year: 252
